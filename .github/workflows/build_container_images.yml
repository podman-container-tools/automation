name: Build container images

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false
      tag:
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: "${{ matrix.image }}"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - "skopeo_cidev"
          - "podman_cidev"
          - "podman-machine-os-ci"
        include:
          - image: skopeo_cidev
            context: container-images/skopeo_cidev
            file: container-images/skopeo_cidev/Containerfile
            multiarch: false
          - image: podman_cidev
            context: .
            file: container-images/podman_cidev/Containerfile
            multiarch: false
          - image: podman-machine-os-ci
            context: container-images/podman-machine-os-ci
            file: container-images/podman-machine-os-ci/Containerfile
            multiarch: true
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.tag }}
      CONTEXT: ${{ matrix.context }}
      CONTAINERFILE: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install qemu-user-static
        if: ${{ matrix.multiarch }}
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Build image
        if: ${{ matrix.multiarch == false }}
        run: podman build -t "$IMAGE" -f "$CONTAINERFILE" "$CONTEXT"

      - name: Build multi arch image
        if: ${{ matrix.multiarch }}
        run: podman build --platform=linux/amd64,linux/arm64 --manifest "$IMAGE" --jobs=2 -f "$CONTAINERFILE" "$CONTEXT"

      - name: Log in to ghcr.io
        if: ${{ inputs.push }}
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_PASSWORD" | podman login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Push multi arch image
        if: ${{ inputs.push && matrix.multiarch }}
        run: podman manifest push --all "$IMAGE"

      - name: Push image
        if: ${{ inputs.push && matrix.multiarch == false}}
        run: podman push "$IMAGE"
